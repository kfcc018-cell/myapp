<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>항목 관리</title>
<style>body{background:#11121a;color:#f4f4f8;font-family:system-ui;margin:0}main{max-width:600px;margin:45px auto;padding:24px}a{color:#cbbaff}label{display:block;margin:24px 0 10px}input{box-sizing:border-box;width:100%;padding:14px;background:#252633;border:1px solid #555166;border-radius:10px;color:white;font:inherit}button{background:#ad92ff;border:0;border-radius:10px;padding:14px 22px;font:inherit;margin-top:24px;cursor:pointer}button:disabled{opacity:.5}#preview{width:100%;height:220px;object-fit:contain;margin-top:20px}p{line-height:1.6;color:#b8b5c9}</style></head>
<body><main><div style="text-align:right"><a href="/">월드컵으로 →</a></div><h1>항목 관리</h1><p>누구나 새로운 항목과 사진을 등록할 수 있습니다.</p>
<form id="form"><label for="content">상사 유형 / 항목 설명</label><input id="content" maxlength="200" required placeholder="예: 퇴근 직전에 일을 주는 상사"><label for="photo">사진 선택</label><input id="photo" type="file" accept="image/jpeg,image/png,image/webp" required><p>JPG, PNG, WEBP · 최대 5MB</p><img id="preview" alt="선택한 사진 미리보기" hidden><button id="submit">항목 등록</button></form><p id="status" role="status"></p></main><script src="/admin.js"></script></body></html>
